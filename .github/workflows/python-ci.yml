name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python examples
        run: python -m compileall -q Python_Programming Data_Analysis
      - name: Run tests
        run: python -m pytest -q
      - name: Run NumPy examples
        run: |
          for script in Data_Analysis/NumPy/*.py; do
            python "$script"
          done
      - name: Run Pandas examples
        run: |
          for script in Data_Analysis/Pandas/*.py; do
            if [ "$script" = "Data_Analysis/Pandas/csv_read_write.py" ]; then
              python "$script" --output /tmp/pandas-example.csv
            else
              python "$script"
            fi
          done
