name: Update README Automation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-main
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Update README timestamp
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TIMESTAMP_LINE="Last updated: $DATE"
          if grep -q "^Last updated:" README.md; then
            sed -i "s/^Last updated:.*/$TIMESTAMP_LINE/" README.md
          else
            printf "\\n%s\\n" "$TIMESTAMP_LINE" >> README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes detected."
            exit 0
          fi
          git commit -m "chore: update README timestamp"
          git push
